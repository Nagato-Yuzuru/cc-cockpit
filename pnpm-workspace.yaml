# Hold new releases for 7 days before install.
minimumReleaseAge: 10080
# A security fix can pin new transitive releases that have no older match.
# Install them instead of failing; other dependencies still get a mature version.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # CI tests the mod on this engine, and the engines floor in
  # .claude-plugin/plugin.json can require the newest release.
  - '@anthropic-ai/claude-code'
  - '@anthropic-ai/claude-code-*'
  # vite-plus 1.7.0 and the releases it pulls in. Its type-aware lint does not
  # have the false await-thenable error of tsgolint 7.0.2005
  # (https://github.com/oxc-project/tsgolint/issues/1291). Every entry is 7 days
  # old on 2026-11-24: remove the entries from here to the end of the list then.
  - '@oxc-project/runtime@0.159.0'
  - '@oxc-project/types@0.159.0'
  - '@oxfmt/binding-android-arm-eabi@0.79.0'
